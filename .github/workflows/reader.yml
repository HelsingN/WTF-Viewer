name: Reader release checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader:
    name: Build, contracts and reader
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.3
      - run: npm run install:ci
      - run: npm run check
      - run: npm run check:research-package
      - run: npx --no-install tsc --noEmit
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify reader and local workspace
        run: bash scripts/checks/run-reader.sh

  parity:
    name: Challenger parity with Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm run install:ci
      - run: python -m pip install 'pydantic==2.13.4' 'pydantic-settings==2.15.0'
      - run: npm run check:challenger
