name: Challenger native validation
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full SHA of the registry baseline commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install pydantic==2.13.4 pydantic-settings==2.15.0 PyYAML
      - run: python scripts/checks/challenger-native.py
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
          RECALC_AUDIT_DIR: ${{ runner.temp }}/challenger-v2-event-recalculations
      - name: Retain QUALIFIED event recalculations for audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: challenger-v2-event-recalculations
          path: ${{ runner.temp }}/challenger-v2-event-recalculations/*.json
          if-no-files-found: ignore
          retention-days: 30
