  trading_signal: false

components:
  R1_monetization_vs_capex:
    level: 1
    weight: 20
    contribution: 10.0
    rationale: >-
      AI/cloud demand and monetization remain strong, but capital deployment is
      extreme and monetizable cash generation must still catch up with the scale
      and duration of deployed infrastructure.

  R2_cash_conversion_fcf:
    level: 1
    weight: 15
    contribution: 7.5
    rationale: >-
      Cash conversion remains uneven across the build-out. Existing evidence of
      negative or compressed FCF at highly capital-intensive participants remains
      meaningful, but broad level-2 deterioration is not established.

  R3_payback_duration_project_economics:
    level: 1
    weight: 15
    contribution: 7.5
    rationale: >-
      Direct evidence of materially lengthening realized payback periods remains
      limited. Compute-price normalization and rising capital intensity remain
      warnings rather than confirmation of widespread uneconomic projects.

  R4_financing_refinancing_dependence:
    level: 2
    weight: 20
    contribution: 20.0
    change_from_prior_same_day: UP_FROM_1
    rationale: >-
      Newly reviewed primary-source evidence shows NVIDIA participating in the AI
      infrastructure financing/support loop through material AI-cloud commitments,
      compute-capacity backstops, project/land/power support or guarantees and
      credit support. Combined with already documented hyperscaler/neocloud debt and
      equity issuance, this is sufficient for level 2 financing dependence even
      though broad funding shutdown or lender refusal is not confirmed.

  R5_backlog_contract_quality:
    level: 1
    weight: 10
    contribution: 5.0
    rationale: >-
      Large long-duration backlog and commitments remain supportive of near-term
      demand, but the growing role of guarantees/backstops means gross backlog and
      commitments cannot automatically be treated as independently funded,
      profitable end demand.

  R6_capacity_funnel_ghost_demand:
    level: 1
    weight: 10
    contribution: 5.0
    rationale: >-
      Announced/contracted capacity continues to exceed independently observable
      utilized and economically profitable capacity. Vendor-supported demand adds a
      quality-of-demand question but does not by itself prove ghost demand.

  R7_project_attrition:
    level: 0
    weight: 10
    contribution: 0.0
    rationale: >-
      No broad independently confirmed wave of economically driven cancellations,
      restructurings or released AI datacenter capacity is present.

physical_confirmation:
  P1_gpu_compute:
    state: WATCH
    rationale: >-
      Pricing and availability normalization remain worth monitoring, but broad
      utilization/renewal weakness is not independently confirmed.
  P2_memory:
    state: ANTI_REVERSAL
    rationale: >-
      Memory remains physically tight with no confirmed inventory/contract-price
      collapse.
  P3_semiconductor_networking:
    state: ANTI_REVERSAL
    rationale: >-
      Accelerator deployment and AI networking demand remain expansionary; vendor
      financial support is not physical semiconductor weakness.
  P4_market_technical:
    state: UNKNOWN
    rationale: >-
      No canonical market/technical snapshot was recomputed for this research-only
      event observation.

