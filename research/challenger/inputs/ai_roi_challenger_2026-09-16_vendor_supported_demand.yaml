new_leading_indicator:
  name: VENDOR_SUPPORTED_DEMAND
  monitor:
    - supplier_credit_support
    - supplier_guarantees
    - compute_purchase_backstops
    - residual_value_guarantees
    - land_power_project_guarantees
    - supplier_investment_in_customers
    - prepayments_and_extended_payment_terms
    - vendor_arranged_financing
  escalation_condition: >-
    Escalate concern if vendor support rises while financing yields/spreads worsen,
    project deferrals or restructurings increase, GPU utilization/renewals weaken,
    rental prices fall because capacity becomes broadly available, or memory and
    networking indicators deteriorate.

interpretation: >-
  Challenger remains ELEVATED and research-only at 55/100. This is a stronger
  early financial warning than the earlier same-day 45/100 observation, but it is
  not a trade signal. Champion remains authoritative and unchanged. Physical-cycle
  confirmation is still largely anti-reversal.

