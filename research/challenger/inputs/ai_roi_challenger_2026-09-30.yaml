interpretation: >-
  Challenger remains ALERT at 60 but advances to Stage 5 because real project
  attrition/delay is now observable. Champion remains WATCH / NO_CANDIDATE and sole
  trading authority. The divergence remains an early warning because GPU, memory and
  semiconductor/networking evidence still does not confirm a physical reversal.

