    P4_market_technical: "UNKNOWN -> WATCH"
  evidence_change: >-
    The score is unchanged, but evidence has propagated into observable project
    delay/attrition across multiple builds. This is not yet a broad ROI-driven
    cancellation wave and physical hardware/memory confirmation remains absent.

