interpretation: >-
  Challenger advances to ALERT / Stage 4 on financial evidence only. Champion remains
  WATCH / NO_CANDIDATE and is the sole trading authority. The divergence remains an
  early warning because memory, semiconductors/networking and physical AI deployment
  do not confirm a reversal.

